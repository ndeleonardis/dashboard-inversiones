# Nginx para servir LemonHouse (T29). Es un ejemplo: antes de usarlo, cambiá
#   lemonhouse.example.com  por el subdominio de tu copia, y
#   TU-PROYECTO             por el ref del proyecto real de Supabase.
# Va en /etc/nginx/sites-available/lemonhouse. Los pasos están en
# docs/levantar-una-copia.md.

# Cuánto puede guardar el navegador cada archivo. Los de assets/ llevan su
# contenido en el nombre, así que nunca cambian. El resto, index.html incluido,
# se revisa cada vez, para que nadie quede con una versión vieja después de
# publicar.
map $uri $lemonhouse_cache {
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

server {
    listen 80;
    listen [::]:80;
    server_name lemonhouse.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lemonhouse.example.com;

    ssl_certificate     /etc/letsencrypt/live/lemonhouse.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lemonhouse.example.com/privkey.pem;

    root /var/www/lemonhouse;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Ninguna location de abajo agrega encabezados: si una lo hiciera, dejaría
    # de mandar todos estos.
    add_header Cache-Control $lemonhouse_cache always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    # La app solo carga sus propios archivos y solo habla con su proyecto de
    # Supabase. Si un script ajeno llegara a la página, no podría mandar la
    # sesión a otro lado.
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://TU-PROYECTO.supabase.co; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    # El manifest de la app instalable. Las versiones viejas de Nginx no
    # conocen la extensión.
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
    }

    # Un archivo de assets/ que no existe da 404, no la app.
    location /assets/ {
        try_files $uri =404;
    }

    # Cualquier otra dirección es una pantalla de la app, como /gastos o
    # /privacidad: se responde con index.html.
    location / {
        try_files $uri /index.html;
    }
}
